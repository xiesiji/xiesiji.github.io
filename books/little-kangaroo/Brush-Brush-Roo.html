let index=0;let feedbackTimer;
const $=id=>document.getElementById(id);
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function render(){stopVoice();clearTimeout(feedbackTimer);const p=book.pages[index];$('art').src=images[index];$('art').alt=p.alt;$('copy').replaceChildren(...p.lines.map(line=>{const s=document.createElement('span');s.textContent=line;return s}));$('page').classList.toggle('cover',index===0);$('page').setAttribute('aria-label',p.lines.join(' ')+' Tap the picture to help Roo.');$('feedback').classList.remove('show');$('count').textContent=(index+1)+' / '+book.pages.length;$('prev').disabled=index===0;$('next').style.display=index===book.pages.length-1?'none':'';$('restart').style.display=index===book.pages.length-1?'inline-block':'none';$('announce').textContent=p.lines.join(' ')}
function move(step){index=Math.max(0,Math.min(book.pages.length-1,index+step));render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>{move(1);if(index===book.pages.length-1)$('restart').focus()};$('restart').onclick=()=>{index=0;render();$('next').focus()};
$('page').onclick=()=>{$('feedback').textContent=book.pages[index].tap;$('feedback').classList.add('show');$('announce').textContent=book.pages[index].tap;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('feedback').classList.remove('show'),3500)};
$('read').onclick=()=>{if(!('speechSynthesis' in window))return;stopVoice();const u=new SpeechSynthesisUtterance(book.pages[index].lines.join(' '));u.lang='en-US';u.rate=.8;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;window.speechSynthesis.speak(u)};
if(!('speechSynthesis' in window)){$('read').disabled=true;$('read').title='Device speech is unavailable'}
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});render();
</script></body></html>
