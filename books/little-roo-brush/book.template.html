<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ed">
<title>Brush, Little Roo!</title>
<style>
@font-face{font-family:Patrick Hand;src:url('__FONT_DATA__') format('truetype');font-display:swap}
:root{color-scheme:light;--ink:#442b1d;--muted:#766757;--paper:#fff;--cream:#faf6ed;--teal:#236b60;--rust:#a3442e}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Patrick Hand',cursive;padding:12px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;min-width:44px;min-height:44px;border:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
button:disabled{cursor:default;opacity:.35}
[hidden]{display:none!important}
.reader{width:min(1100px,calc(100vw - 32px),calc((100svh - 230px) * 1.333333));min-width:min(288px,100%);margin-inline:auto;container:reader / inline-size}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:8px}
.brand{font-size:22px;margin:0;font-weight:400;white-space:nowrap}
.tools{display:flex;gap:4px}
.tool{background:transparent;padding:6px 12px;font-size:19px;border-radius:12px}
.tool:hover{background:#efe7d9}
.page{position:relative;aspect-ratio:4/3;background:white;border-radius:14px;box-shadow:0 5px 28px #725b3020;isolation:isolate;container:page / inline-size}
.art{display:block;width:100%;height:100%;object-fit:contain;border-radius:14px;user-select:none;-webkit-user-drag:none}
.words{position:absolute;top:4%;inset-inline:4%;margin:0;text-align:center;font-weight:400;font-size:clamp(22px,5.9cqw,66px);line-height:1.04;white-space:pre-line;text-wrap:balance;pointer-events:none}
.words.cover{font-size:clamp(28px,7cqw,78px)}
.tap{position:absolute;inset:24% 0 0;background:transparent;border-radius:12px}
.tap:focus-visible{outline-offset:-6px}
.sparkle{position:absolute;left:39%;top:45%;font-family:serif;font-size:clamp(24px,5cqw,50px);color:#c18a14;pointer-events:none;opacity:0}
.sparkle.show{opacity:1}
.diagram-highlight{position:absolute;left:55.5%;width:38%;height:17%;border:3px dashed var(--teal);border-radius:20px;pointer-events:none}
.tick{position:absolute;top:35%;font-size:clamp(22px,4cqw,42px);line-height:1;background:var(--teal);color:white;border-radius:50%;width:1.25em;height:1.25em;text-align:center;pointer-events:none}
.tick.sun{left:11%}.tick.moon{right:13%}
.interaction{display:flex;justify-content:center;align-items:center;gap:8px;min-height:48px;margin-top:3px;flex-wrap:wrap}
.hint{font-size:20px;color:var(--muted);text-align:center;margin:0;line-height:1.2}
.choice{font-size:19px;background:#eee8da;border-radius:22px;padding:6px 17px;min-width:70px;min-height:44px}
.choice[aria-pressed=true]{background:var(--teal);color:white}
.feedback{color:var(--teal)}
.navigation{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:2px;min-height:48px}
.nav-button{font-size:21px;padding:6px 17px;border-radius:13px;background:#eee7d9;justify-self:start;white-space:nowrap}
.nav-button.next{background:var(--rust);color:white;justify-self:end;min-width:104px}
.counter{font-size:18px;color:var(--muted);white-space:nowrap;min-width:48px;text-align:center}
.dots{display:flex;justify-content:center;gap:0;margin:2px auto 0;max-width:100%}
.dot{position:relative;background:transparent;width:44px;min-height:44px}
.dot::before{content:'';display:block;margin:auto;width:6px;height:6px;background:#c8baa4;border-radius:50%}
.dot[aria-current=page]::before{background:var(--rust);width:9px;height:9px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@container reader (width < 760px){.dots{display:none}}
@container reader (width < 480px){.brand{font-size:19px}.tool{font-size:17px;padding:5px 7px}.topbar{gap:4px}.hint{font-size:18px}.choice{font-size:18px;padding:5px 12px;min-width:62px}.navigation{gap:6px}.nav-button{font-size:19px;padding:6px 13px}.nav-button.next{min-width:94px}.words{top:3.8%}.page,.art{border-radius:10px}}
@container reader (width < 360px){.words{top:2.5%}}
@media (prefers-reduced-motion:no-preference){.sparkle.show{animation:spark .6s ease-out}.page.arrive .art{animation:arrive .18s ease-out}.choice{transition:background-color .15s,color .15s}@keyframes spark{0%{opacity:0;transform:scale(.5) rotate(-15deg)}40%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}@keyframes arrive{from{opacity:.7}to{opacity:1}}}
@media (max-height:500px) and (orientation:landscape){body{padding-top:4px;padding-bottom:4px}.reader{width:min(calc(100vw - 32px),calc((100svh - 146px)*1.333333));min-width:260px}.topbar{margin-bottom:3px;min-height:44px}.interaction{margin-top:0;min-height:44px}.navigation{min-height:44px;margin-top:0}.dots{display:none}}
</style>
</head>
<body>
<main class="reader">
  <header class="topbar">
    <h1 class="brand">Little Roo’s little habits</h1>
    <div class="tools"><button class="tool" id="read" type="button">♪ Read aloud</button><button class="tool" id="restart" type="button" aria-label="Start over">↺</button></div>
  </header>
  <article class="page" id="page" aria-labelledby="words">
    <img class="art" id="art" width="1448" height="1086" alt="" fetchpriority="high">
    <h2 class="words" id="words"></h2>
    <button class="tap" id="tap" type="button" aria-describedby="hint"></button>
    <span class="sparkle" id="sparkle" aria-hidden="true">✦</span>
    <span class="diagram-highlight" id="highlight" aria-hidden="true" hidden></span>
    <span class="tick sun" id="sunTick" aria-hidden="true" hidden>✓</span>
    <span class="tick moon" id="moonTick" aria-hidden="true" hidden>✓</span>
  </article>
  <div class="interaction" id="interaction"><p class="hint" id="hint"></p><div id="choices" hidden></div></div>
  <nav class="navigation" aria-label="Book pages">
    <button class="nav-button" id="previous" type="button">← Back</button>
    <span class="counter" id="counter"></span>
    <button class="nav-button next" id="next" type="button">Next →</button>
  </nav>
  <nav class="dots" id="dots" aria-label="Jump to a page"></nav>
  <p class="sr-only" id="announcement" role="status" aria-atomic="true"></p>
  <noscript><p>Please enable JavaScript to read this interactive book.</p></noscript>
</main>
<!-- Patrick Hand font license:
__FONT_LICENSE__
-->
<script>
'use strict';
const STORY=__STORY_DATA__;
const IMAGES=__IMAGE_DATA__;
const $=id=>document.getElementById(id);
const labels=['Begin the story','Enjoy a happy bite','Help Roo get ready to brush','Choose to brush teeth','Choose to care for teeth','Brush gently with Roo','Practise front, back and tops','Choose morning and night','Celebrate healthy habits'];
const state=STORY.map(()=>({taps:0,parts:[false,false,false],times:[false,false],active:-1}));
let index=0,utterance=null,sparkTimer=null;
const speechAvailable='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
if(!speechAvailable){$('read').hidden=true;}
function stopSpeech(){if(speechAvailable)window.speechSynthesis.cancel();utterance=null;$('read').textContent='♪ Read aloud';}
function feedback(text){$('hint').textContent=text;$('hint').classList.add('feedback');$('announcement').textContent=text;}
function sparkle(){clearTimeout(sparkTimer);$('sparkle').classList.remove('show');void $('sparkle').offsetWidth;$('sparkle').classList.add('show');sparkTimer=setTimeout(()=>$('sparkle').classList.remove('show'),900);}
function choices(){
  const box=$('choices');box.replaceChildren();box.hidden=![6,7].includes(index);
  if(box.hidden)return;
  const names=index===6?['Front','Back','Tops']:['Morning','Night'];
  const values=index===6?state[index].parts:state[index].times;
  names.forEach((name,n)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=name;b.setAttribute('aria-pressed',String(values[n]));b.addEventListener('click',()=>{activate(n);});box.appendChild(b);});
}
function syncChoices(){const values=index===6?state[index].parts:state[index].times;[...$('choices').children].forEach((b,n)=>b.setAttribute('aria-pressed',String(values[n])));}
function activate(n){
  const s=state[index];
  if(index===6){s.parts[n]=true;s.active=n;$('highlight').hidden=false;$('highlight').style.top=[30,51,73][n]+'%';feedback(s.parts.every(Boolean)?'All sides. Well done!':['Front teeth!','Inside, too!','Chewing tops!'][n]);}
  if(index===7){s.times[n]=true;$(n===0?'sunTick':'moonTick').hidden=false;feedback(s.times.every(Boolean)?'Morning AND night!':n===0?'Good morning, Roo!':'Good night, Roo!');}
  syncChoices();sparkle();
}
function tap(){
  const s=state[index];
  if(index===0){go(1);return;}
  s.taps++;
  if(index===6){const n=s.parts.findIndex(v=>!v);activate(n<0?(s.active+1)%3:n);return;}
  if(index===7){activate(s.times[0]?1:0);return;}
  const responses={1:'Crunch, crunch!',2:'Let’s brush!',3:'Let’s brush them!',4:'Let’s care for our teeth!',5:['Gentle circles!','Brush all around!','Great brushing!'][Math.min(s.taps-1,2)],8:'Hooray for brushing!'};
  feedback(responses[index]);sparkle();
}
function render(){
  const page=STORY[index];const s=state[index];
  $('page').classList.remove('arrive');
  $('art').src=IMAGES[page.id];$('art').alt=page.alt;
  $('words').textContent=page.text;$('words').classList.toggle('cover',index===0);
  $('tap').setAttribute('aria-label',labels[index]);
  $('hint').textContent=page.interaction;$('hint').classList.remove('feedback');
  $('previous').disabled=index===0;$('next').textContent=index===0?'Let’s read →':index===STORY.length-1?'Read again ↺':'Next →';
  $('counter').textContent=(index+1)+' / '+STORY.length;
  document.title=(index+1)+' · '+page.text.replace(/\n/g,' ')+' | Little Roo';
  $('highlight').hidden=index!==6||s.active<0;
  if(index===6&&s.active>=0)$('highlight').style.top=[30,51,73][s.active]+'%';
  $('sunTick').hidden=index!==7||!s.times[0];$('moonTick').hidden=index!==7||!s.times[1];
  $('sparkle').classList.remove('show');choices();
  [...$('dots').children].forEach((b,n)=>{if(n===index)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('announcement').textContent='Page '+(index+1)+'. '+page.text.replace(/\n/g,' ');
  requestAnimationFrame(()=>$('page').classList.add('arrive'));
}
function go(n){if(n<0||n>=STORY.length)return;stopSpeech();clearTimeout(sparkTimer);index=n;render();}
function restart(){state.forEach(s=>{s.taps=0;s.parts.fill(false);s.times.fill(false);s.active=-1;});go(0);}
STORY.forEach((page,n)=>{const b=document.createElement('button');b.type='button';b.className='dot';b.setAttribute('aria-label','Page '+(n+1)+': '+page.text.replace(/\n/g,' '));b.addEventListener('click',()=>go(n));$('dots').appendChild(b);});
$('tap').addEventListener('click',tap);
$('previous').addEventListener('click',()=>go(index-1));
$('next').addEventListener('click',()=>index===STORY.length-1?restart():go(index+1));
$('restart').addEventListener('click',restart);
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1);}});
$('read').addEventListener('click',()=>{
  if(!speechAvailable)return;
  if(utterance){stopSpeech();return;}
  const voices=window.speechSynthesis.getVoices();
  const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));
  if(!voice&&voices.length){feedback('English voice unavailable on this device.');return;}
  utterance=new SpeechSynthesisUtterance(STORY[index].text.replace(/\n/g,' '));utterance.lang='en-US';utterance.rate=.8;if(voice)utterance.voice=voice;
  utterance.onend=()=>{utterance=null;$('read').textContent='♪ Read aloud';};
  utterance.onerror=e=>{utterance=null;$('read').textContent='♪ Read aloud';if(e.error!=='canceled'&&e.error!=='interrupted')feedback('Voice unavailable. Let’s read together!');};
  $('read').textContent='■ Stop';window.speechSynthesis.speak(utterance);
});
window.addEventListener('pagehide',stopSpeech);
render();
</script>
</body>
</html>
